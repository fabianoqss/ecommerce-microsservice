x-oci-postgresql-ca: &oci-postgresql-ca
  - ./scripts/prod/certs/oci-postgresql-ca.pem:/etc/ecommerce/oci-postgresql-ca.pem:ro

x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-java-app: &java-app
  <<: *no-new-privileges
  mem_limit: 1280m
  memswap_limit: 1280m
  cpus: 2
  pids_limit: 512
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  environment:
    JAVA_TOOL_OPTIONS: -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
  pull_policy: missing
  build: !reset null

services:

  keycloak:
    <<: *no-new-privileges
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      KC_HOSTNAME_ADMIN: &keycloak-admin-url http://localhost:8180
    volumes: *oci-postgresql-ca

  keycloak-config:
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      IMPORT_FILES_LOCATIONS: /config/*.yaml,/config-prod/*.yaml
      KEYCLOAK_ADMIN_URL: *keycloak-admin-url
    volumes:
      - ./scripts/prod/keycloak:/config-prod:ro

  rabbitmq:
    <<: *no-new-privileges
    mem_limit: 1g
    memswap_limit: 1g

  rabbitmq-init:
    <<: *no-new-privileges
    mem_limit: 64m
    memswap_limit: 64m

  redis:
    <<: *no-new-privileges
    mem_limit: 256m
    memswap_limit: 256m

  zipkin:
    <<: *no-new-privileges
    mem_limit: 768m
    memswap_limit: 768m

  prometheus:
    <<: *no-new-privileges
    mem_limit: 512m
    memswap_limit: 512m

  grafana:
    <<: *no-new-privileges
    mem_limit: 512m
    memswap_limit: 512m

  product-service:
    <<: *java-app
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY no .env}/ecommerce-product-service:${IMAGE_TAG:?defina IMAGE_TAG no .env}

  inventory-service:
    <<: *java-app
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY no .env}/ecommerce-inventory-service:${IMAGE_TAG:?defina IMAGE_TAG no .env}
    volumes: *oci-postgresql-ca

  notification-service:
    <<: *java-app
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY no .env}/ecommerce-notification-service:${IMAGE_TAG:?defina IMAGE_TAG no .env}

  order-service:
    <<: *java-app
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY no .env}/ecommerce-order-service:${IMAGE_TAG:?defina IMAGE_TAG no .env}
    volumes: *oci-postgresql-ca

  api-gateway:
    <<: *java-app
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY no .env}/ecommerce-api-gateway:${IMAGE_TAG:?defina IMAGE_TAG no .env}
