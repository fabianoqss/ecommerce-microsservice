version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directories:
      - /api-gateway
      - /product-service
      - /inventory-service
      - /order-service
      - /notification-service
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
