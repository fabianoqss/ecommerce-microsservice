name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo de um commit da main com imagens publicadas pelo CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy em produção
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: https://loja.fabianoquirinos.com.br
    permissions:
      contents: read
      attestations: read
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      SERVICES: product-service inventory-service notification-service order-service api-gateway
      OCI_CLI_VERSION: 3.94.2
      PUBLIC_URL: https://loja.fabianoquirinos.com.br
    steps:
      - name: Validar SHA
        run: |
          [[ $DEPLOY_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido"; exit 1; }
          echo "Deploy de $DEPLOY_SHA"

      - name: Checkout da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirmar que o commit está na main
        run: |
          git cat-file -e "${DEPLOY_SHA}^{commit}" || { echo "::error::Commit inexistente"; exit 1; }
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || { echo "::error::Commit fora da main"; exit 1; }

      - name: Verificar proveniência das imagens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${REPOSITORY%%/*}
          for service in $SERVICES; do
            gh attestation verify "oci://ghcr.io/${owner,,}/ecommerce-${service}:${DEPLOY_SHA}" \
              --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
            echo "Atestado válido: $service"
          done

      - name: Instalar OCI CLI
        run: pipx install "oci-cli==$OCI_CLI_VERSION"

      - name: Configurar credenciais da OCI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          umask 077
          config_dir="$RUNNER_TEMP/oci"
          mkdir -p "$config_dir"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$config_dir/key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$OCI_TENANCY_OCID" "$OCI_REGION" "$config_dir/key.pem" \
            > "$config_dir/config"
          echo "OCI_CLI_CONFIG_FILE=$config_dir/config" >> "$GITHUB_ENV"

      - name: Executar release na VM via Run Command
        env:
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_INSTANCE_OCID: ${{ vars.OCI_INSTANCE_OCID }}
        run: |
          content=$(jq -cn --arg text "sudo /opt/ecommerce/scripts/prod/release.sh $DEPLOY_SHA" \
            '{source: {sourceType: "TEXT", text: $text}, output: {outputType: "TEXT"}}')
          target=$(jq -cn --arg id "$OCI_INSTANCE_OCID" '{instanceId: $id}')
          command_id=$(oci instance-agent command create \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --target "$target" \
            --content "$content" \
            --timeout-in-seconds 1500 \
            --display-name "deploy-${DEPLOY_SHA:0:12}" \
            --query data.id --raw-output)
          echo "Comando: $command_id"

          deadline=$((SECONDS + 1800))
          state=''
          execution='{}'
          while (( SECONDS < deadline )); do
            if execution=$(oci instance-agent command-execution get \
                --command-id "$command_id" --instance-id "$OCI_INSTANCE_OCID" 2>/dev/null); then
              state=$(jq -r '.data."lifecycle-state"' <<< "$execution")
              case "$state" in
                SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              esac
            fi
            sleep 15
          done

          echo "::group::Saída do release.sh"
          jq -r '.data.content.text // ""' <<< "$execution"
          echo "::endgroup::"
          exit_code=$(jq -r '.data.content."exit-code" // "desconhecido"' <<< "$execution")
          echo "Estado: ${state:-sem resposta}, código de saída: $exit_code"
          [[ $state == SUCCEEDED && $exit_code == 0 ]] || { echo "::error::Deploy falhou na VM"; exit 1; }

      - name: Smoke test externo
        run: |
          check() {
            local expected=$1 path=$2 status
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$PUBLIC_URL$path")
            [[ $status == "$expected" ]] || { echo "::error::$path respondeu $status, esperado $expected"; return 1; }
            echo "$path -> $status"
          }
          check 200 /api/product
          check 401 /api/order
          check 403 /actuator/health

      - name: Remover credenciais da OCI
        if: always()
        run: rm -rf "$RUNNER_TEMP/oci"
