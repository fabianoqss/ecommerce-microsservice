server:
  port: 8080
  # Respeita X-Forwarded-* (nginx em produção) ao montar o redirect_uri do login.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
            - id: product-service-root
              uri: lb://product-service
              predicates:
                - Path=/api/product
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
            - id: order-service-root
              uri: lb://order-service
              predicates:
                - Path=/api/order
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
            - id: inventory-service-root
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory
              filters:
                # O cookie de sessão do BFF nunca chega aos microsserviços.
                - RemoveRequestHeader=Cookie
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri só valida o claim iss; com jwk-set-uri presente não há discovery na subida.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:ecommerce-api}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  session:
    redis:
      namespace: ecommerce:gateway:session

ecommerce:
  bff:
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    # URL pública do IdP (navegador) e a mesma URL vista de dentro da rede do Compose.
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce}
    internal-issuer-uri: ${OIDC_INTERNAL_ISSUER_URI:http://localhost:8180/realms/ecommerce}
    client-id: ${OIDC_BFF_CLIENT_ID:ecommerce-bff}
    client-secret: ${KC_BFF_CLIENT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.servlet.function: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
