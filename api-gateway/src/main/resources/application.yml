server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        globalcors:
          cors-configurations:
            '[/**]':
              allowed-origins: "*"
              allowed-methods: "*"
              allowed-headers: "*"
        routes:
          - id: product-service
            uri: lb://product-service
            predicates:
              - Path=/api/product/**

          - id: product-service-root
            uri: lb://product-service
            predicates:
              - Path=/api/product

          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/order/**

          - id: order-service-root
            uri: lb://order-service
            predicates:
              - Path=/api/order

          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**

          - id: inventory-service-root
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, gateway
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
