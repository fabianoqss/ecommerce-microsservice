server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/product,/api/product/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
                - RemoveRequestHeader=tracestate
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/order,/api/order/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
                - RemoveRequestHeader=tracestate
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventory,/api/inventory/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
                - RemoveRequestHeader=tracestate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:ecommerce-api}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  session:
    redis:
      namespace: ecommerce:gateway:session

ecommerce:
  bff:
    post-login-redirect-uri: ${BFF_POST_LOGIN_REDIRECT_URI:/bff/me}
    post-logout-redirect-uri: ${BFF_POST_LOGOUT_REDIRECT_URI:}
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce}
    internal-issuer-uri: ${OIDC_INTERNAL_ISSUER_URI:http://localhost:8180/realms/ecommerce}
    client-id: ${OIDC_BFF_CLIENT_ID:ecommerce-bff}
    client-secret: ${KC_BFF_CLIENT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.servlet.function: INFO

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
