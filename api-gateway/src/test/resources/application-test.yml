spring:
  cloud:
    discovery:
      enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: ${backend.url}
              predicates:
                - Path=/api/product/**
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
            - id: product-service-root
              uri: ${backend.url}
              predicates:
                - Path=/api/product
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
            - id: order-service
              uri: ${backend.url}
              predicates:
                - Path=/api/order/**
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
            - id: order-service-root
              uri: ${backend.url}
              predicates:
                - Path=/api/order
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
            - id: inventory-service
              uri: ${backend.url}
              predicates:
                - Path=/api/inventory/**
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN
            - id: inventory-service-root
              uri: ${backend.url}
              predicates:
                - Path=/api/inventory
              filters:
                # Cookie de sessão e token CSRF do BFF nunca chegam aos microsserviços.
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=X-XSRF-TOKEN

eureka:
  client:
    enabled: false

KC_BFF_CLIENT_SECRET: bff-secret-test
BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
