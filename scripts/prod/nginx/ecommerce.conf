server_tokens off;

upstream api_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream keycloak {
    server 127.0.0.1:8180;
    keepalive 16;
}

# TLS comum a todos os server 443 (perfil "intermediate" da Mozilla, só ECDHE)
ssl_certificate     /etc/letsencrypt/live/loja.fabianoquirinos.com.br/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/loja.fabianoquirinos.com.br/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name loja.fabianoquirinos.com.br auth.fabianoquirinos.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name loja.fabianoquirinos.com.br;

    # No nível do server: um add_header dentro de location anularia a herança destes
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    location / {
        proxy_pass http://api_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 443 ssl http2;
    server_name auth.fabianoquirinos.com.br;

    # Headers de segurança ficam a cargo do Keycloak (por realm), para não duplicar

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Keycloak devolve cookies e headers grandes no fluxo de login
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Realm master (administração) não sai da VM: acesso só por túnel SSH
    location /realms/master {
        return 404;
    }

    location /realms/ {
        proxy_pass http://keycloak;
    }

    location /resources/ {
        proxy_pass http://keycloak;
    }

    # Todo o resto (/admin, /metrics, /, ...) não é exposto
    location / {
        return 404;
    }
}

# Acesso pelo IP ou com Host desconhecido (scanners): fecha a conexão sem resposta
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    # Recusa o handshake TLS sem apresentar o certificado (não vaza os nomes do SAN)
    ssl_reject_handshake on;
}
