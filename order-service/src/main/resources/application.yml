server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order-service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Carrega os itens de vários pedidos num único SELECT ... WHERE order_id IN (...),
        # em vez de uma query por pedido (N+1) ao montar uma página da listagem.
        default_batch_fetch_size: 50

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2.0
        max-attempts: 3
        max-interval: 5s

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri só valida o claim iss; com jwk-set-uri presente não há discovery na subida.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:ecommerce-api}
      client:
        registration:
          order-service:
            provider: oidc
            client-id: order-service
            client-secret: ${KC_ORDER_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          oidc:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/token}

  cloud:
    openfeign:
      client:
        config:
          default:
            # Evita threads e conexões presas em dependências lentas.
            connect-timeout: 2000
            read-timeout: 5000

clients:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

ecommerce:
  order:
    reservation:
      max-attempts: 3
      retry-delay: 50ms
    reconciliation:
      # Idade mínima muito maior que o tempo máximo do fluxo síncrono (3 tentativas x 5s read-timeout).
      fixed-delay: 30000
      min-age: 2m
      batch-size: 50
    outbox:
      base-backoff: 5s
      max-backoff: 30m
      max-attempts: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
