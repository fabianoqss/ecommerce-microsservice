# Compose de produção: serviços da aplicação + o que roda na própria VM
# (Keycloak, RabbitMQ, Redis e monitoramento). Os bancos (OCI Database with
# PostgreSQL e Autonomous JSON) ficam fora e entram só por variáveis de
# ambiente, então trocar a infraestrutura não exige mudar este arquivo.
#
# Desenvolvimento local (Postgres e Mongo em containers):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Variáveis com ":?" são obrigatórias: o compose falha antes de subir se faltar alguma.

x-app-env: &app-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME:?defina EUREKA_USERNAME}:${EUREKA_PASSWORD:?defina EUREKA_PASSWORD}@eureka-server:8761/eureka/
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

# Resource Servers: nomes genéricos de OIDC, o provedor (hoje Keycloak) muda sem mexer no código.
# O issuer é a URL pública (vai no "iss"); as chaves vêm pela rede interna do Compose.
x-oidc-env: &oidc-env
  OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?defina OIDC_ISSUER_URI}
  OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?defina OIDC_JWK_SET_URI}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?defina OIDC_AUDIENCE}

x-rabbitmq-env: &rabbitmq-env
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_VIRTUAL_HOST: ecommerce

services:

  # ─── INFRAESTRUTURA NA VM ───────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: keycloak
    # O realm "ecommerce" é código (keycloak/realm-ecommerce.yaml), aplicado pelo keycloak-config.
    command: ["start"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:?defina KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?defina KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
      # URL pública (a que vai no "iss" dos tokens); o TLS termina no nginx.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?defina KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080" # exposto só para o nginx da própria VM
    healthcheck:
      # A imagem não tem curl; o health fica na porta de gerenciamento 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: ${RESTART_POLICY:-unless-stopped}

  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    # Execução única a cada subida: reconcilia o realm com keycloak/realm-ecommerce.yaml.
    # Sem cache, alterações feitas à mão no console são revertidas para o que está no git.
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Um valor de variável nunca é reinterpretado como nova expressão de substituição.
      IMPORT_VARSUBSTITUTION_NESTED: "false"
      IMPORT_CACHE_ENABLED: "false"
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?defina GATEWAY_PUBLIC_URL}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:?defina KC_BFF_CLIENT_SECRET}
      KC_ORDER_SERVICE_CLIENT_SECRET: ${KC_ORDER_SERVICE_CLIENT_SECRET:?defina KC_ORDER_SERVICE_CLIENT_SECRET}
      KC_SMTP_HOST: ${KC_SMTP_HOST:?defina KC_SMTP_HOST}
      KC_SMTP_PORT: ${KC_SMTP_PORT:?defina KC_SMTP_PORT}
      KC_SMTP_FROM: ${KC_SMTP_FROM:?defina KC_SMTP_FROM}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:?defina KC_SMTP_STARTTLS}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:?defina KC_SMTP_AUTH}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
    volumes:
      - ./keycloak:/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.2.5-management
    container_name: rabbitmq
    hostname: rabbitmq # o diretório de dados depende do nome do nó
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USERNAME:?defina RABBITMQ_ADMIN_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?defina RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ecommerce
    ports:
      - "127.0.0.1:15672:15672" # console só por túnel SSH
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  rabbitmq-init:
    image: curlimages/curl:8.17.0
    # PUTs idempotentes; uma falha impede os produtores/consumidores de iniciar.
    entrypoint: ["/bin/sh", "/scripts/rabbitmq-init.sh"]
    environment:
      RABBITMQ_ADMIN_USERNAME: ${RABBITMQ_ADMIN_USERNAME:?defina RABBITMQ_ADMIN_USERNAME}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?defina RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_ORDER_PASSWORD: ${RABBITMQ_ORDER_PASSWORD:?defina RABBITMQ_ORDER_PASSWORD}
      RABBITMQ_NOTIFICATION_PASSWORD: ${RABBITMQ_NOTIFICATION_PASSWORD:?defina RABBITMQ_NOTIFICATION_PASSWORD}
      RABBITMQ_INVENTORY_PASSWORD: ${RABBITMQ_INVENTORY_PASSWORD:?defina RABBITMQ_INVENTORY_PASSWORD}
    volumes:
      - ./scripts/rabbitmq-init.sh:/scripts/rabbitmq-init.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4.11-alpine3.21
    container_name: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  # ─── MONITORAMENTO ──────────────────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin@sha256:ebfd47b93879b4bec4075ea3a4b07744c5476bae8dca3f6f9c2aca798ceaf0cc
    container_name: zipkin
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  prometheus:
    image: prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    container_name: prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: ${RESTART_POLICY:-unless-stopped}

  grafana:
    image: grafana/grafana@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: ${RESTART_POLICY:-unless-stopped}

  # ─── MICROSSERVIÇOS ─────────────────────────────────────────────────────────

  # Porta 8761 só na rede interna; health e métricas públicos dependem desse isolamento.
  eureka-server:
    build: { context: ., dockerfile: eureka-server/Dockerfile }
    profiles: ["apps"]
    container_name: eureka-server
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:?defina EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?defina EUREKA_PASSWORD}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      zipkin:
        condition: service_healthy
        required: false # zipkin fica no profile "monitoring", que é opcional
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  product-service:
    build: { context: ., dockerfile: product-service/Dockerfile }
    profiles: ["apps"]
    container_name: product-service
    environment:
      <<: [*app-env, *oidc-env]
      SPRING_MONGODB_URI: ${PRODUCT_MONGODB_URI:?defina PRODUCT_MONGODB_URI}
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    profiles: ["apps"]
    container_name: inventory-service
    environment:
      <<: [*app-env, *rabbitmq-env, *oidc-env]
      SPRING_RABBITMQ_USERNAME: inventory-service
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_INVENTORY_PASSWORD:?defina RABBITMQ_INVENTORY_PASSWORD}
      DB_URL: ${INVENTORY_DB_URL:?defina INVENTORY_DB_URL}
      DB_USERNAME: ${INVENTORY_DB_USERNAME:?defina INVENTORY_DB_USERNAME}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?defina INVENTORY_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  notification-service:
    build: { context: ., dockerfile: notification-service/Dockerfile }
    profiles: ["apps"]
    container_name: notification-service
    environment:
      <<: [*app-env, *rabbitmq-env]
      SPRING_RABBITMQ_USERNAME: notification-service
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_NOTIFICATION_PASSWORD:?defina RABBITMQ_NOTIFICATION_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    profiles: ["apps"]
    container_name: order-service
    environment:
      <<: [*app-env, *rabbitmq-env, *oidc-env]
      SPRING_RABBITMQ_USERNAME: order-service
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_ORDER_PASSWORD:?defina RABBITMQ_ORDER_PASSWORD}
      DB_URL: ${ORDER_DB_URL:?defina ORDER_DB_URL}
      DB_USERNAME: ${ORDER_DB_USERNAME:?defina ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?defina ORDER_DB_PASSWORD}
      # Token de serviço (client_credentials) para chamar o inventory.
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI:?defina OIDC_TOKEN_URI}
      KC_ORDER_SERVICE_CLIENT_SECRET: ${KC_ORDER_SERVICE_CLIENT_SECRET:?defina KC_ORDER_SERVICE_CLIENT_SECRET}
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    profiles: ["apps"]
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080" # exposto só para o nginx da própria VM
    environment:
      <<: [*app-env, *oidc-env]
      # BFF: login no navegador; back-channel (token, JWKs) pela rede interna.
      OIDC_INTERNAL_ISSUER_URI: ${OIDC_INTERNAL_ISSUER_URI:?defina OIDC_INTERNAL_ISSUER_URI}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:?defina KC_BFF_CLIENT_SECRET}
      BFF_POST_LOGIN_REDIRECT_URI: ${BFF_POST_LOGIN_REDIRECT_URI:-/bff/me}
      BFF_POST_LOGOUT_REDIRECT_URI: ${BFF_POST_LOGOUT_REDIRECT_URI:-}
      # true em produção (HTTPS no nginx): o cookie de sessão só trafega por TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      MANAGEMENT_SERVER_PORT: 8090
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  rabbitmq-data:
  redis-data:
  grafana-data:
