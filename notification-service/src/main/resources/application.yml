server:
  port: 8084

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        observation-enabled: true
        missing-queues-fatal: false
        prefetch: 10
        retry:
          enabled: true
          stateless: true
          max-retries: 7
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}
            required: ${SPRING_MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

ecommerce:
  notification:
    channel: ${NOTIFICATION_CHANNEL:log}
    mail:
      from: ${NOTIFICATION_MAIL_FROM:noreply@localhost}
    idempotency:
      processing-ttl: ${NOTIFICATION_IDEMPOTENCY_PROCESSING_TTL:30s}
      processed-ttl: ${NOTIFICATION_IDEMPOTENCY_PROCESSED_TTL:7d}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
