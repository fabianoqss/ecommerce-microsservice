<header class="bg-primary text-primary-contrast">
  <div
    class="grid min-h-[70px] grid-cols-1 items-center gap-3 px-5 py-4 sm:grid-cols-[1fr_auto_1fr] sm:gap-0 sm:px-10 sm:py-0"
  >
    <span class="text-2xl font-bold leading-normal tracking-[-0.36px] whitespace-nowrap">
      DS Catalog
    </span>

    <nav aria-label="Navegação principal">
      <ul
        class="flex flex-wrap items-center gap-x-8 gap-y-2 text-lg leading-normal tracking-[-0.27px] sm:gap-x-[70px]"
      >
        <li>
          <a
            routerLink="/"
            routerLinkActive="font-bold opacity-100"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            #homeLink="routerLinkActive"
            [class.font-semibold]="!homeLink.isActive"
            [class.opacity-50]="!homeLink.isActive"
            class="rounded-sm transition-opacity hover:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current focus-visible:opacity-100"
            >HOME</a
          >
        </li>
        <li>
          <a
            routerLink="/catalog"
            routerLinkActive="font-bold opacity-100"
            ariaCurrentWhenActive="page"
            #catalogLink="routerLinkActive"
            [class.font-semibold]="!catalogLink.isActive"
            [class.opacity-50]="!catalogLink.isActive"
            class="rounded-sm transition-opacity hover:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current focus-visible:opacity-100"
            >CATÁLOGO</a
          >
        </li>
        <li><span class="font-semibold opacity-50">ADMIN</span></li>
      </ul>
    </nav>
  </div>
</header>
