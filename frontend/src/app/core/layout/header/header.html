<header class="bg-primary font-sans text-white">
  <div
    class="grid h-[50px] grid-cols-[1fr_auto] items-center px-5 md:h-[70px] md:grid-cols-[1fr_auto_1fr] md:px-10"
  >
    <span
      class="text-lg font-bold leading-normal tracking-[-0.27px] whitespace-nowrap md:text-2xl md:tracking-[-0.36px]"
    >
      DS Catalog
    </span>

    <nav aria-label="Navegação principal" class="hidden md:block">
      <ul class="flex items-center gap-x-[86px] text-lg leading-normal tracking-[-0.27px]">
        <ng-container [ngTemplateOutlet]="links" [ngTemplateOutletContext]="{ mobile: false }" />
      </ul>
    </nav>

    <div
      class="hidden min-w-0 flex-wrap items-center justify-end gap-x-4 gap-y-2 text-lg leading-normal font-semibold tracking-[-0.27px] md:flex"
    >
      <ng-container [ngTemplateOutlet]="account" />
    </div>

    <button
      #menuButton
      type="button"
      class="flex size-11 cursor-pointer items-center justify-end rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="header-mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
      (click)="toggleMenu()"
    >
      <img src="/images/icons/menu.svg" alt="" width="17" height="17" />
    </button>
  </div>

  @if (menuOpen()) {
    <nav
      id="header-mobile-menu"
      aria-label="Navegação móvel"
      class="w-full bg-primary pt-[44px] pr-5 pb-[42px] pl-[35px] text-lg leading-normal font-bold tracking-[-0.27px] md:hidden"
    >
      <ul class="flex flex-col items-start gap-[30px]">
        <ng-container [ngTemplateOutlet]="links" [ngTemplateOutletContext]="{ mobile: true }" />
      </ul>
      <div class="mt-8 flex flex-wrap items-center gap-x-4 gap-y-2">
        <ng-container [ngTemplateOutlet]="account" />
      </div>
    </nav>
  }
</header>

<ng-template #links let-mobile="mobile">
  @for (link of navigationLinks(); track link.path) {
    <li>
      <a
        [routerLink]="link.path"
        routerLinkActive="opacity-100"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        ariaCurrentWhenActive="page"
        #activeLink="routerLinkActive"
        [class.font-bold]="mobile || activeLink.isActive"
        [class.font-semibold]="!mobile && !activeLink.isActive"
        [class.opacity-50]="!mobile && !activeLink.isActive"
        (click)="closeMenu()"
        class="rounded-sm transition-opacity hover:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current focus-visible:opacity-100"
        >{{ link.label }}</a
      >
    </li>
  }
</ng-template>

<ng-template #account>
  @if (auth.isAuthenticated()) {
    <a
      routerLink="/cart"
      [attr.aria-label]="cartLabel()"
      (click)="closeMenu()"
      class="relative inline-flex min-h-11 min-w-11 items-center justify-center rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current"
    >
      <span class="pi pi-shopping-cart text-xl" aria-hidden="true"></span>
      @if (cart.totalQuantity() > 0) {
        <span
          aria-hidden="true"
          class="absolute -top-1 -right-1 rounded-full bg-primary-contrast px-1.5 py-0.5 text-xs font-bold text-primary"
          >{{ cart.totalQuantity() }}</span
        >
      }
    </a>
    <span class="wrap-anywhere md:font-normal">{{ firstName() }}</span>
  }
  <button
    type="button"
    (click)="auth.isAuthenticated() ? logout() : login()"
    class="min-h-11 cursor-pointer rounded-sm focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current"
  >
    {{ auth.isAuthenticated() ? 'SAIR' : 'ENTRAR' }}
  </button>
</ng-template>
