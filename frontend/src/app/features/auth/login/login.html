<div class="grid items-start gap-10 xl:grid-cols-[minmax(0,1fr)_551px] xl:gap-[62px]">
  <section
    aria-labelledby="login-intro-title"
    class="mx-auto w-full max-w-[747px] xl:pt-[34px] xl:pl-[100px]"
  >
    <h2
      id="login-intro-title"
      class="text-color text-4xl leading-[normal] font-bold tracking-[-0.825px] wrap-break-word sm:text-[55px] xl:min-h-[150px]"
    >
      Divulgue seus produtos no DS Catalog
    </h2>
    <p
      class="text-muted-color mt-[26px] max-w-[516px] text-xl leading-[normal] font-normal tracking-[-0.36px] wrap-break-word sm:text-2xl xl:min-h-[78px]"
    >
      Faça parte do nosso catálogo de divulgação e aumente a venda dos seus produtos.
    </p>
    <img
      src="/images/desenho.svg"
      width="535"
      height="479"
      alt=""
      aria-hidden="true"
      class="mx-auto mt-[39px] block h-auto max-w-full xl:mr-0 xl:ml-[17px]"
    />
  </section>

  <p-card class="mx-auto block w-full max-w-[551px]" styleClass="w-full min-h-[780px]">
    <section aria-labelledby="login-title" class="px-5 py-7 sm:px-[50px]">
      <h1
        id="login-title"
        class="text-color text-center text-5xl leading-[67px] font-normal tracking-[-0.72px]"
      >
        LOGIN
      </h1>

      <div class="mt-7 flex flex-col gap-6">
        <div>
          <label for="login-email" class="sr-only">Email</label>
          <input
            pInputText
            id="login-email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="Email"
            class="h-[50px] w-full px-5 text-lg tracking-[-0.27px]"
          />
        </div>
        <div>
          <label for="login-password" class="sr-only">Senha</label>
          <input
            pInputText
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Senha"
            class="h-[50px] w-full px-5 text-lg tracking-[-0.27px]"
          />
        </div>
      </div>

      <button type="button" disabled class="mt-3 text-lg leading-7 tracking-[-0.27px] text-primary">
        Esqueci a senha?
      </button>

      <a
        href="/oauth2/authorization/keycloak"
        aria-label="Logar"
        class="mt-8 flex h-[70px] w-full items-center overflow-hidden rounded-[10px] bg-primary text-primary-contrast transition-colors hover:bg-primary-emphasis focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
      >
        <span class="flex-1 text-center text-2xl font-bold tracking-[-0.36px]">LOGAR</span>
        <span
          aria-hidden="true"
          class="flex h-full w-[70px] shrink-0 items-center justify-center bg-surface-900/50"
        >
          <i class="pi pi-angle-right text-2xl"></i>
        </span>
      </a>

      <p
        class="mt-6 flex flex-wrap items-center justify-center gap-x-2 text-center text-lg leading-[25px] font-bold tracking-[-0.27px]"
      >
        <span class="text-muted-color">Não tem Cadastro?</span>
        <button type="button" disabled class="text-primary underline underline-offset-2">
          CADASTRAR
        </button>
      </p>

      <div
        role="group"
        aria-label="Outras opções de login"
        class="mt-4 flex flex-col items-center gap-1 border-t border-surface pt-3"
      >
        <button type="button" disabled class="inline-flex min-h-10 items-center gap-2 text-primary">
          <img src="/icons/google.svg" width="20" height="20" alt="" aria-hidden="true" />
          <span class="text-base font-semibold underline underline-offset-4"
            >Continue with Google</span
          >
        </button>
        <button type="button" disabled class="inline-flex min-h-10 items-center gap-2 text-primary">
          <img
            src="/icons/apple.svg"
            width="20"
            height="20"
            alt=""
            aria-hidden="true"
            class="dark:invert"
          />
          <span class="text-base font-semibold underline underline-offset-4"
            >Continue with Apple</span
          >
        </button>
        <button type="button" disabled class="inline-flex min-h-10 items-center gap-2 text-primary">
          <img src="/icons/microsoft.svg" width="21" height="21" alt="" aria-hidden="true" />
          <span class="text-base font-semibold underline underline-offset-4"
            >Continue with Microsoft</span
          >
        </button>
      </div>
    </section>
  </p-card>
</div>
