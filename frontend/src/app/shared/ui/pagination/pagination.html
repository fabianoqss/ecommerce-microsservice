@if (totalPages() > 1) {
  <nav aria-label="Paginação" class="flex items-center justify-center gap-1 min-[480px]:gap-[9px]">
    <button
      type="button"
      aria-label="Página anterior"
      [disabled]="page() <= 0"
      (click)="pageChange.emit(page() - 1)"
      class="flex h-10 w-6 shrink-0 items-center justify-center rounded-full text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:text-surface-200 sm:w-10"
    >
      <span class="pi pi-angle-left text-2xl" aria-hidden="true"></span>
    </button>
    @for (item of pages(); track item) {
      @if (typeof item === 'number') {
        <button
          type="button"
          [attr.aria-label]="'Página ' + (item + 1)"
          [attr.aria-current]="item === page() ? 'page' : null"
          [class.bg-primary]="item === page()"
          [class.bg-surface-200]="item !== page()"
          (click)="pageChange.emit(item)"
          class="size-10 shrink-0 rounded-full text-lg font-bold text-primary-contrast focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >
          {{ item + 1 }}
        </button>
      } @else {
        <span aria-hidden="true" class="text-muted-color">…</span>
      }
    }
    <button
      type="button"
      aria-label="Próxima página"
      [disabled]="page() >= totalPages() - 1"
      (click)="pageChange.emit(page() + 1)"
      class="flex h-10 w-6 shrink-0 items-center justify-center rounded-full text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:text-surface-200 sm:w-10"
    >
      <span class="pi pi-angle-right text-2xl" aria-hidden="true"></span>
    </button>
  </nav>
}
