# Override de desenvolvimento local: adiciona os bancos em containers, que em
# produção são serviços da OCI. Use sempre junto com o arquivo base:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Os endereços desses containers vêm do .env local (veja .env.example).

services:

  # ─── BANCOS (SÓ EM DEV) ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16.12
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  mongo:
    image: mongo:7.0.45
    container_name: mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  # ─── DADOS DE DEMONSTRAÇÃO (SÓ EM DEV) ──────────────────────────────────────

  # Execução única a cada subida, idempotente e sem sobrescrever dados existentes.
  # Recarregar sem recriar volumes: docker compose ... up seed-products seed-inventory
  seed-products:
    image: mongo:7.0.45
    command: ["mongosh", "--quiet", "mongodb://mongo:27017/product_db", "/seed/products.js"]
    volumes:
      - ./scripts/dev/seed:/seed:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  seed-inventory:
    image: postgres:16.12
    entrypoint: ["/bin/sh", "/seed/seed-inventory.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      PGDATABASE: inventory_service
    volumes:
      - ./scripts/dev/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── AJUSTES DE DEV NOS SERVIÇOS DO ARQUIVO BASE ────────────────────────────

  # SMTP falso: captura os e-mails do Keycloak (verificação, recuperação de senha)
  # sem enviar nada para fora. Leitura em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    restart: "no"

  keycloak:
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy

  # Portas publicadas para os serviços rodando pela IDE, fora do Compose.
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api-gateway:
    environment:
      SESSION_COOKIE_SECURE: "false"

  product-service:
    depends_on:
      mongo:
        condition: service_healthy
      seed-products:
        condition: service_completed_successfully

  inventory-service:
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    depends_on:
      postgres:
        condition: service_healthy
      # Pedidos de demonstração precisam do estoque carregado.
      seed-inventory:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mongo-data:
