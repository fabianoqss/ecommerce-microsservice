services:

  postgres:
    image: postgres:16.12
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  mongo:
    image: mongo:7.0.45
    container_name: mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  seed-products:
    image: mongo:7.0.45
    command: ["mongosh", "--quiet", "mongodb://mongo:27017/product_db", "/seed/products.js"]
    volumes:
      - ./scripts/dev/seed:/seed:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  seed-inventory:
    image: postgres:16.12
    entrypoint: ["/bin/sh", "/seed/seed-inventory.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      PGDATABASE: inventory_service
    volumes:
      - ./scripts/dev/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    restart: "no"

  keycloak:
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api-gateway:
    environment:
      SESSION_COOKIE_SECURE: "false"

  product-service:
    depends_on:
      mongo:
        condition: service_healthy
      seed-products:
        condition: service_completed_successfully

  inventory-service:
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    depends_on:
      postgres:
        condition: service_healthy
      seed-inventory:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mongo-data:
